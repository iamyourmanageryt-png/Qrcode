<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave a Review</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <div id="loading-state" class="header-text">Loading business info...</div>
    
    <div id="content-state" style="display: none;">
      <div class="header-text">
        <h1 id="business-name">Business Name</h1>
        <p class="text-light">Tap a review below to copy and post it instantly to Google.</p>
      </div>

      <div id="templates-container">
        <!-- Review templates generated by JS -->
      </div>
    </div>
  </div>

  <!-- Invisible Copy Toast -->
  <div id="success-toast" class="toast-overlay">
    <h2>Review Copied! 📋</h2>
    <p>Paste it on the next screen.</p>
    <div class="spinner"></div>
  </div>

  <script type="module" src="consumer.js"></script>
</body>
</html>
