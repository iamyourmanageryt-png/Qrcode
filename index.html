<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feasibility Media - Review Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/feather-icons"></script>

  <style>
    /* --- GLOBAL UI --- */
    :root {
      --primary: #2563eb; --primary-dark: #1d4ed8;
      --bg-color: #f8fafc; --surface: #ffffff;
      --text-main: #0f172a; --text-muted: #64748b;
      --border: #e2e8f0; --danger: #ef4444;
      --shadow-sm: 0 4px 6px -1px rgba(0,0,0,0.05);
      --shadow-md: 0 10px 15px -3px rgba(0,0,0,0.1);
      --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 20px; }

    /* --- CONSUMER REDIRECT --- */
    #consumer-view { display: none; text-align: center; margin: 20vh auto; max-width: 400px; background: white; padding: 40px; border-radius: 24px; box-shadow: var(--shadow-lg); }
    .pulse-ring { width: 80px; height: 80px; border-radius: 50%; background: rgba(37,99,235,0.1); margin: 0 auto 24px; display: flex; justify-content: center; align-items: center; position: relative; }
    .pulse-ring::before { content: ''; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid var(--primary); animation: pulse 1.5s linear infinite; opacity: 0; }
    @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.5; } 100% { transform: scale(1.3); opacity: 0; } }

    /* --- ADMIN DASHBOARD --- */
    .admin-container { display: none; width: 100%; max-width: 1100px; margin: 0 auto; display: grid; gap: 24px; grid-template-columns: 1fr; }
    @media(min-width: 900px) { .admin-container { grid-template-columns: 1fr 400px; } } /* Split layout */

    .card { background: var(--surface); border-radius: 20px; padding: 32px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
    .header-card { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; }
    
    /* Forms & Inputs */
    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
    .input-group input, .input-group select { width: 100%; padding: 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 15px; outline: none; transition: 0.2s; background: #fff; }
    .input-group input:focus, .input-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(37,99,235,0.1); }
    
    .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; }
    .file-upload-wrapper input[type=file] { position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; width: 100%; }
    .file-upload-btn { display: flex; align-items: center; gap: 8px; justify-content: center; background: #f1f5f9; border: 1.5px dashed #cbd5e1; padding: 20px; border-radius: 12px; color: var(--text-muted); font-weight: 600; transition: 0.2s; }
    .file-upload-wrapper:hover .file-upload-btn { border-color: var(--primary); color: var(--primary); background: #eff6ff; }
    #logo-preview { max-width: 80px; max-height: 80px; border-radius: 10px; margin-top: 10px; display: none; object-fit: contain; }

    .btn { background: var(--primary); color: white; border: none; padding: 16px 20px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; justify-content: center; width: 100%; }
    .btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; }

    /* Generator Box */
    .generator-box { background: #f8fafc; padding: 16px; border-radius: 12px; border: 1px solid #e2e8f0; margin-top: 8px; }
    .generator-box input { background: transparent; border: none; width: 100%; color: var(--primary); font-weight: 600; font-size: 14px; margin-top: 4px; pointer-events: none;}
    
    /* List */
    .client-list { display: grid; gap: 12px; max-height: 500px; overflow-y: auto; padding-right: 8px;}
    .client-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: #f8fafc; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; transition: 0.2s; }
    .client-item:hover { border-color: var(--primary); }
    .client-info h3 { font-size: 15px; margin-bottom: 4px; }
    .client-info p { font-size: 12px; color: var(--text-muted); font-family: monospace; }
    .icon-btn { padding: 8px; border-radius: 8px; border: none; background: #e2e8f0; cursor: pointer; color: var(--text-main); transition: 0.2s; }
    .icon-btn:hover { background: #cbd5e1; }
    .icon-btn.del { background: #fee2e2; color: var(--danger); }
    .icon-btn.del:hover { background: #fecaca; }

    /* --- PREMIUM STANDEE TEMPLATES (4x6 Aspect Ratio) --- */
    .preview-sticky { position: sticky; top: 20px; }
    
    .standee-canvas {
      width: 100%; aspect-ratio: 4 / 6;
      border-radius: 16px; position: relative; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 10%; box-shadow: var(--shadow-lg); transition: all 0.3s ease;
      background: white; border: 1px solid var(--border); margin-bottom: 20px;
    }
    
    .standee-header { text-align: center; width: 100%; z-index: 2; }
    .standee-logo-img { max-width: 100px; max-height: 80px; object-fit: contain; margin-bottom: 15px; display: none; }
    .standee-biz-name { font-size: clamp(20px, 5vw, 28px); font-weight: 800; line-height: 1.2; letter-spacing: -0.5px; margin-bottom: 10px; }
    .standee-google-img { width: 110px; margin-bottom: 15px; }
    
    .standee-qr-box { background: white; padding: 12px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); position: relative; z-index: 2; }
    
    .standee-footer { text-align: center; z-index: 2; }
    .standee-stars { color: #FBBC04; font-size: 30px; letter-spacing: 2px; line-height: 1; margin-bottom: 8px; }
    .standee-cta { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; }

    /* TEMPLATE 1: Classic */
    .tpl-classic { background: white; color: #1e293b; }
    .tpl-classic::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 8px; background: linear-gradient(90deg, #4285F4 25%, #EA4335 25% 50%, #FBBC04 50% 75%, #34A853 75%); }

    /* TEMPLATE 2: Dark Mode */
    .tpl-dark { background: #0f172a; color: #ffffff; }
    .tpl-dark .standee-biz-name { color: white; }
    .tpl-dark .standee-cta { color: #cbd5e1; }
    .tpl-dark .standee-qr-box { border: 2px solid #334155; }

    /* TEMPLATE 3: Brand Focused */
    .tpl-brand { background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); color: #0f172a; justify-content: center; gap: 30px; }
    .tpl-brand .standee-google-img, .tpl-brand .standee-stars { display: none; }
    .tpl-brand .standee-cta { background: #1e293b; color: white; padding: 10px 20px; border-radius: 30px; display: inline-block; }
    
    /* TEMPLATE 4: Minimalist Elegant */
    .tpl-minimal { background: white; color: #1e293b; justify-content: center; gap: 20px;}
    .tpl-minimal .standee-biz-name { font-weight: 500; font-size: 20px; margin-top: 10px; }
    .tpl-minimal .standee-stars, .tpl-minimal .standee-google-img { display: none; }
    .tpl-minimal .standee-qr-box { box-shadow: none; border: 1px solid #e2e8f0; }

    /* --- PRINT MEDIA QUERY (Actual 4x6 Physical Print) --- */
    @media print {
      body * { visibility: hidden; background: white; }
      body { margin: 0; padding: 0; display: block; }
      #live-preview-section, #live-preview-section * { visibility: visible; }
      #live-preview-section { position: absolute; left: 0; top: 0; width: 100%; padding: 0; margin: 0; border: none; box-shadow: none; }
      
      .preview-sticky { position: static; }
      #btn-print { display: none; }
      
      .standee-canvas {
        width: 4in !important; height: 6in !important;
        margin: 0.5in auto;
        border: 1px dashed #cbd5e1 !important; /* Cut line */
        border-radius: 0 !important;
        box-shadow: none !important;
        padding: 40px 30px !important;
      }
    }
  </style>
</head>
<body>

  <!-- 1. CONSUMER REDIRECT -->
  <div id="consumer-view">
    <div class="pulse-ring"><i data-feather="smartphone" style="color: var(--primary); width: 32px;"></i></div>
    <h1 style="font-size: 24px; font-weight:700; margin-bottom: 8px;" id="c-biz-name">Authenticating...</h1>
    <p style="color: var(--text-muted);">Securely routing you to Google Reviews.</p>
  </div>

  <!-- 2. ADMIN DASHBOARD -->
  <div id="admin-view" class="admin-container">
    
    <div class="card header-card">
      <div>
        <h1 style="font-size: 24px; font-weight: 800; letter-spacing: -0.5px;">Feasibility Media Hub</h1>
        <p style="color: var(--text-muted); font-size: 14px;">Enterprise QR & Review Engine</p>
      </div>
      <i data-feather="box" style="color: var(--primary); width: 32px; height: 32px;"></i>
    </div>

    <!-- LEFT COLUMN: Form & List -->
    <div style="display: flex; flex-direction: column; gap: 24px;">
      
      <div class="card">
        <h2 style="font-size: 18px; margin-bottom: 20px; display:flex; justify-content:space-between;" id="form-title">
          <span>Create New Standee</span>
          <button class="icon-btn" onclick="resetForm()" title="Clear Form"><i data-feather="plus"></i></button>
        </h2>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="input-group">
            <label>QR Tag ID (Unique)</label>
            <input type="text" id="f-qr-id" placeholder="e.g., VK-001" oninput="updatePreview()">
          </div>
          <div class="input-group">
            <label>Client Name</label>
            <input type="text" id="f-biz-name" placeholder="e.g., Vidya Kendra" oninput="updatePreview()">
          </div>
        </div>

        <div class="input-group">
          <label>1. Paste Google Maps Link</label>
          <input type="url" id="f-maps-link" placeholder="Paste the raw Google Maps URL here..." oninput="generateReviewLink()">
          <div class="generator-box">
            <span style="font-size: 12px; color: var(--text-muted); font-weight:600;">Auto-Generated Direct Review Link:</span>
            <input type="text" id="f-direct-link" placeholder="Waiting for Maps link..." readonly>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="input-group">
            <label>2. Standee Design Template</label>
            <select id="f-template" onchange="updatePreview()">
              <option value="tpl-classic">Classic Google (White)</option>
              <option value="tpl-dark">Premium Dark (Slate)</option>
              <option value="tpl-brand">Brand Focused (Modern)</option>
              <option value="tpl-minimal">Minimalist (Clean)</option>
            </select>
          </div>

          <div class="input-group">
            <label>3. Upload Client Logo</label>
            <div class="file-upload-wrapper">
              <div class="file-upload-btn">
                <i data-feather="upload-cloud"></i> <span id="file-name">Choose Image</span>
              </div>
              <input type="file" id="f-logo-upload" accept="image/*" onchange="handleImagePreview(this)">
            </div>
            <img id="logo-preview" src="">
          </div>
        </div>

        <input type="hidden" id="f-existing-logo-url">
        <button id="btn-save" class="btn"><i data-feather="save"></i> Save & Generate Standee</button>
      </div>

      <div class="card">
        <h2 style="font-size: 16px; margin-bottom: 16px; color: var(--text-muted);">Active QR Database</h2>
        <div class="client-list" id="client-list">
          <p style="text-align:center; color:var(--text-muted);">Loading data...</p>
        </div>
      </div>

    </div>

    <!-- RIGHT COLUMN: Live Preview -->
    <div id="live-preview-section" class="card preview-sticky">
      <h2 style="font-size: 16px; margin-bottom: 20px; color: var(--text-muted); display:flex; justify-content:space-between; align-items:center;">
        <span>Live Print Preview (4x6")</span>
      </h2>

      <!-- The Standee Canvas -->
      <div id="preview-canvas" class="standee-canvas tpl-classic">
        <div class="standee-header">
          <img src="" id="p-logo" class="standee-logo-img">
          <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_2015_logo.svg" class="standee-google-img" alt="Google">
          <h1 class="standee-biz-name" id="p-biz-name">Client Name</h1>
        </div>
        
        <div class="standee-qr-box">
          <div id="p-qr-code"></div>
        </div>
        
        <div class="standee-footer">
          <div class="standee-stars">★★★★★</div>
          <div class="standee-cta">Review us today</div>
        </div>
      </div>

      <button id="btn-print" class="btn" style="background: #0f172a;" onclick="window.print()">
        <i data-feather="printer"></i> Print Physical Standee
      </button>
    </div>

  </div>

  <script type="module">
    import { db } from "./firebase-config.js";
    import { doc, getDoc, setDoc, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    // Important: Initialize Firebase Storage in your firebase-config.js and export `storage`
    // import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
    import { app } from "./firebase-config.js"; // Ensure app is exported from config
    const storage = getStorage(app);

    feather.replace();

    // ROUTER
    const urlParams = new URLSearchParams(window.location.search);
    const qrId = urlParams.get('id');
    let qrGenerator = null;

    if (qrId) {
      document.getElementById('consumer-view').style.display = 'block';
      initConsumerRedirect(qrId);
    } else {
      document.getElementById('admin-view').style.display = 'grid';
      initAdminView();
    }

    /* =========================================
       1. CONSUMER REDIRECT
    ========================================= */
    async function initConsumerRedirect(id) {
      try {
        const docSnap = await getDoc(doc(db, "qrcodes", id));
        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById('c-biz-name').innerText = data.businessName;
          setTimeout(() => { window.location.replace(data.directLink || data.googleLink); }, 1000);
        } else {
          document.getElementById('c-biz-name').innerText = "Inactive Tag";
        }
      } catch (err) {
        document.getElementById('c-biz-name').innerText = "Network Error";
      }
    }

    /* =========================================
       2. LINK GENERATOR ENGINE
    ========================================= */
    window.generateReviewLink = () => {
      const input = document.getElementById('f-maps-link').value.trim();
      const output = document.getElementById('f-direct-link');
      
      if (!input) { output.value = ""; return; }
      if (input.includes('search.google.com/local/writereview')) { output.value = input; return; }
      
      // Handle short g.page links
      if (input.includes('g.page/')) {
        output.value = input.endsWith('/') ? input + 'review' : input + '/review';
        return;
      }

      // Handle standard Google Maps links (Extracting CID via Hex conversion)
      // Google Maps structure: !1s0x(hex1):0x(hex2) -> hex2 is the feature ID (CID in hex)
      const hexMatch = input.match(/!1s0x[0-9a-fA-F]+:0x([0-9a-fA-F]+)/);
      if (hexMatch && hexMatch[1]) {
        try {
          // Convert Hexadecimal to Decimal BigInt
          const cid = BigInt('0x' + hexMatch[1]).toString(10);
          output.value = `https://search.google.com/local/writereview?placeid=${cid}`; // Sometimes PlaceID accepts CID decimal
          // Actually, Google's fallback for CID is specific:
          output.value = `https://search.google.com/local/writereview?addreview&cid=${cid}`;
          return;
        } catch(e) {}
      }

      // Handle direct place_id param
      const placeIdMatch = input.match(/place_id=([^&]+)/);
      if (placeIdMatch && placeIdMatch[1]) {
        output.value = `https://search.google.com/local/writereview?placeid=${placeIdMatch[1]}`;
        return;
      }

      // Fallback: If we can't parse it securely, use the raw link (user can manually fix if needed)
      output.value = input;
    };

    /* =========================================
       3. ADMIN DASHBOARD & UI
    ========================================= */
    function initAdminView() {
      // Initialize empty QR Code
      qrGenerator = new QRCode(document.getElementById("p-qr-code"), {
        text: window.location.origin, width: 140, height: 140, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H
      });

      document.getElementById('btn-save').addEventListener('click', saveTag);
      fetchAndRenderTags();
      updatePreview();
    }

    // Live Preview Engine
    window.updatePreview = () => {
      const name = document.getElementById('f-biz-name').value || "Client Name";
      const id = document.getElementById('f-qr-id').value || "TEST-001";
      const template = document.getElementById('f-template').value;
      
      document.getElementById('p-biz-name').innerText = name;
      
      // Apply Template Class
      const canvas = document.getElementById('preview-canvas');
      canvas.className = `standee-canvas ${template}`;

      // Update QR Code
      const redirectUrl = window.location.origin + window.location.pathname + "?id=" + id;
      if(qrGenerator) { qrGenerator.clear(); qrGenerator.makeCode(redirectUrl); }
    };

    // Handle Logo Image Selection
    window.handleImagePreview = (input) => {
      const file = input.files[0];
      if (file) {
        document.getElementById('file-name').innerText = "Logo Selected";
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.getElementById('logo-preview');
          const pLogo = document.getElementById('p-logo');
          img.src = e.target.result;
          img.style.display = 'block';
          pLogo.src = e.target.result;
          pLogo.style.display = 'block';
        }
        reader.readAsDataURL(file);
      }
    };

    window.resetForm = () => {
      document.getElementById('form-title').innerHTML = '<span>Create New Standee</span>';
      document.getElementById('f-qr-id').value = '';
      document.getElementById('f-qr-id').disabled = false;
      document.getElementById('f-biz-name').value = '';
      document.getElementById('f-maps-link').value = '';
      document.getElementById('f-direct-link').value = '';
      document.getElementById('f-existing-logo-url').value = '';
      document.getElementById('f-template').value = 'tpl-classic';
      
      document.getElementById('f-logo-upload').value = '';
      document.getElementById('file-name').innerText = "Choose Image";
      document.getElementById('logo-preview').style.display = 'none';
      document.getElementById('p-logo').style.display = 'none';
      
      updatePreview();
    };

    // --- FIREBASE CRUD ---
    async function fetchAndRenderTags() {
      const listEl = document.getElementById('client-list');
      try {
        const querySnapshot = await getDocs(collection(db, "qrcodes"));
        listEl.innerHTML = ''; 

        if (querySnapshot.empty) {
          listEl.innerHTML = '<p style="text-align:center; color:#64748b; padding:20px;">No database entries.</p>';
          return;
        }

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const item = document.createElement('div');
          item.className = 'client-item';
          item.innerHTML = `
            <div class="client-info" onclick="window.editTag('${doc.id}')">
              <h3>${data.businessName}</h3>
              <p>ID: ${doc.id}</p>
            </div>
            <button class="icon-btn del" onclick="window.deleteTag('${doc.id}', '${data.businessName}')" title="Delete">
              <i data-feather="trash-2"></i>
            </button>
          `;
          listEl.appendChild(item);
        });
        feather.replace();
      } catch (error) { console.error(error); }
    }

    async function saveTag() {
      const id = document.getElementById('f-qr-id').value.trim();
      const name = document.getElementById('f-biz-name').value.trim();
      const mapsLink = document.getElementById('f-maps-link').value.trim();
      const directLink = document.getElementById('f-direct-link').value.trim();
      const template = document.getElementById('f-template').value;
      const fileInput = document.getElementById('f-logo-upload');
      const btn = document.getElementById('btn-save');

      if (!id || !name || !directLink) { alert("Please fill ID, Name, and Link."); return; }

      btn.disabled = true;
      btn.innerHTML = 'Saving Data...';
      
      try {
        let logoUrl = document.getElementById('f-existing-logo-url').value;

        // Upload new image to Firebase Storage if selected
        if (fileInput.files.length > 0) {
          btn.innerHTML = 'Uploading Logo...';
          const file = fileInput.files[0];
          const storageRef = ref(storage, `logos/${id}_${Date.now()}`);
          await uploadBytes(storageRef, file);
          logoUrl = await getDownloadURL(storageRef);
        }

        await setDoc(doc(db, "qrcodes", id), {
          status: "active",
          businessName: name,
          googleMapsLink: mapsLink,
          directLink: directLink,
          template: template,
          logoUrl: logoUrl,
          updatedAt: new Date()
        }, { merge: true });

        alert("Saved & Ready to Print!");
        fetchAndRenderTags();
      } catch (err) {
        console.error(err);
        alert("Error saving data.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i data-feather="save"></i> Save & Generate Standee';
        feather.replace();
      }
    }

    window.editTag = async (id) => {
      try {
        const docSnap = await getDoc(doc(db, "qrcodes", id));
        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById('form-title').innerHTML = `<span>Editing: ${id}</span>`;
          document.getElementById('f-qr-id').value = id;
          document.getElementById('f-qr-id').disabled = true; 
          document.getElementById('f-biz-name').value = data.businessName;
          document.getElementById('f-maps-link').value = data.googleMapsLink || "";
          document.getElementById('f-direct-link').value = data.directLink;
          document.getElementById('f-template').value = data.template || "tpl-classic";
          
          if (data.logoUrl) {
            document.getElementById('f-existing-logo-url').value = data.logoUrl;
            document.getElementById('logo-preview').src = data.logoUrl;
            document.getElementById('logo-preview').style.display = 'block';
            document.getElementById('p-logo').src = data.logoUrl;
            document.getElementById('p-logo').style.display = 'block';
          }
          
          updatePreview();
          window.scrollTo(0,0);
        }
      } catch(e) { console.error(e); }
    };

    window.deleteTag = async (id, name) => {
      if(confirm(`Permanently delete tag for ${name}?`)) {
        try { await deleteDoc(doc(db, "qrcodes", id)); fetchAndRenderTags(); resetForm(); } catch (e) { alert("Error deleting"); }
      }
    };
  </script>
</body>
</html>
